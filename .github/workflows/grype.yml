name: Vulnerability scan

on:
  push:
    branches: [master]
  schedule:
    # Weekly, to catch newly published vulnerabilities when the code hasn't changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  grype:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Report only: findings go to the Security tab and never fail the run.

      - name: Scan requirements.txt
        id: scan-requirements
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          fail-build: false
          cache-db: true

      - name: Upload requirements results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan-requirements.outputs.sarif }}
          category: grype-requirements

      - name: Build app image
        run: docker build --tag ip-api:scan .

      - name: Scan app image
        id: scan-app
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ip-api:scan
          fail-build: false
          cache-db: true

      - name: Upload app image results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan-app.outputs.sarif }}
          category: grype-app-image

      # Read the tag from docker-compose.yml so the scan matches what gets deployed.
      - name: Find Caddy image
        id: caddy
        run: echo "image=$(yq '.services.caddy.image' docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Scan Caddy image
        id: scan-caddy
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.caddy.outputs.image }}
          fail-build: false
          cache-db: true

      - name: Upload Caddy image results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan-caddy.outputs.sarif }}
          category: grype-caddy-image
