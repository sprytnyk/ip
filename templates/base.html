<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}What's My IP{% endblock %}</title>
    <meta name="description" content="Check your IP address and location details instantly">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/static/site.webmanifest">

    <!-- Favicons -->
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/static/favicon-16x16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/static/favicon-32x32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

    <!-- Meta Tags for App Branding -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">

    <script>
        // Set the theme before the page is drawn, so it doesn't flash
        (() => {
            let theme;
            try {
                theme = localStorage.getItem("ip-theme");
            } catch {}
            if (theme !== "light" && theme !== "dark") {
                theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="/">
                <span class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
                </span>
                <span class="brand-name">ip</span>
            </a>
            <div class="controls">
                <a class="pill-link" href="/docs/">API</a>
                <button type="button" class="icon-button" id="theme" aria-label="Switch theme">
                    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <p>Location data from <a href="https://dev.maxmind.com/geoip/geolite2-free-geolocation-data/" target="_blank" rel="noopener noreferrer">MaxMind GeoLite2</a></p>
            <p><a href="/docs/">API documentation</a></p>
            <p>Your data isn't collected: see the <a href="https://github.com/sprytnyk/ip" target="_blank" rel="noopener noreferrer">source on GitHub</a></p>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
