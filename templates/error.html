{% extends "base.html" %}

{% block title %}Error - What's My IP{% endblock %}

{% block content %}
<div class="intro">
    <h1>Something went wrong</h1>
</div>

<div class="cards">
    <section class="card">
        <div class="card-heading">
            <span class="section-icon bad" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            </span>
            <div>
                <h2>The lookup failed</h2>
                <p>Please try again later.</p>
            </div>
        </div>
        <div class="items">
            <div class="item">
                <span class="tag">{{ status_code }}</span>
                <p class="value">{{ detail }}</p>
            </div>
        </div>
        <a class="button" href="/">Try again</a>
    </section>
</div>
{% endblock %}
