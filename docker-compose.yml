services:
  # FastAPI service (API)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_service
    restart: unless-stopped
    volumes:
      # Read-only: the app only reads them; geolite-update replaces them on the host.
      - ./city.mmdb:/home/user/app/city.mmdb:ro
      - ./asn.mmdb:/home/user/app/asn.mmdb:ro
    networks:
      - backend
    ports:
      # Nameserver for dns.<DOMAIN>, used by the DNS leak test. The app listens
      # on an unprivileged port, so it needs no capabilities.
      - "53:5300/udp"
      - "53:5300/tcp"
    environment:
      - PYTHONUNBUFFERED=1
      # The DNS leak test answers for dns.<DOMAIN> with ns.<DOMAIN> as its nameserver.
      - DOMAIN=${DOMAIN:?DOMAIN must be set in .env}
    # Hardening: the app writes nothing to disk and needs no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Caddy service (Reverse Proxy)
  caddy:
    image: caddy:2
    container_name: caddy_service
    restart: unless-stopped
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # Persistent storage for Caddy (SSL certs, etc.)
      - caddy_config:/config
    environment:
      # Substituted into the Caddyfile site addresses; must be set in .env.
      - DOMAIN=${DOMAIN:?DOMAIN must be set in .env}
    networks:
      - backend
    depends_on:
      - api  # Caddy proxies to the API, so start it first

# Define networks for internal communication
networks:
  backend:
    driver: bridge
    # Give the proxy a native IPv6 endpoint. Without this, Docker's userland
    # proxy translates IPv6 connections to the container's IPv4 address and
    # Caddy sees the bridge gateway (for example, 172.18.0.1) as the client.
    enable_ipv6: true

# Volumes for persistent storage
volumes:
  caddy_data:
  caddy_config:
